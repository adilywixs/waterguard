<script>
const T={
n1:'Problem|Проблема|Мәселе',n2:'Solution|Решение|Шешім',n3:'How it works|Как это работает|Қалай жұмыс істейді',n4:'Impact|Эффект|Әсер',n5:'Sources|Источники|Дереккөздер',si:'Sign In|Войти|Кіру',su:'Sign Up|Регистрация|Тіркелу',

pd:'An organization can receive a water bill every month, but that does not always show when unusual consumption started or where it happened.|Организация получает счёт за воду каждый месяц, но он не всегда показывает, когда началось необычное потребление и где оно произошло.|Ұйым су үшін ай сайын шот алады, бірақ ол әдеттен тыс тұтыну қашан басталғанын және қайда болғанын әрдайым көрсете бермейді.',

hwd:'WaterGuard does not see a broken pipe. It compares actual use with the normal pattern and flags consumption that may indicate a leak.|WaterGuard не «видит» сломанную трубу. Он сравнивает фактический расход с обычным и отмечает потребление, которое может указывать на утечку.|WaterGuard сынған құбырды «көрмейді». Ол нақты шығынды әдеттегі үлгімен салыстырып, ағуға меңзеуі мүмкін тұтынуды белгілейді.',
bl:'Normal readings: 78, 82, 80, 81, 79 m³ → baseline ≈ 80 m³. New reading: 116 m³ → deviation +45%. Above the alert threshold → “Possible leak / abnormal usage detected”.|Обычные показания: 78, 82, 80, 81, 79 м³ → база ≈ 80 м³. Новое: 116 м³ → отклонение +45%. Выше порога → «Обнаружена возможная утечка / аномальный расход».|Қалыпты көрсеткіштер: 78, 82, 80, 81, 79 м³ → негіз ≈ 80 м³. Жаңа көрсеткіш: 116 м³ → ауытқу +45%. Шектен жоғары → «Ықтимал су ағуы / ауытқыған шығын анықталды».',
g1:'Anomaly~An unusual change compared with normal water use.|Аномалия~Необычное изменение по сравнению с обычным расходом воды.|Аномалия~Әдеттегі су шығынымен салыстырғанда ерекше өзгеріс.',
g2:'Baseline~The amount of water normally used.|База~Количество воды, которое обычно расходуется.|Негіз~Әдетте жұмсалатын су мөлшері.',
g3:'Deviation~How much actual usage differs from normal.|Отклонение~Насколько фактический расход отличается от обычного.|Ауытқу~Нақты шығын әдеттегіден қаншалықты өзгеше.',
g4:'Remote data~Meter readings sent automatically instead of being entered manually.|Удалённые данные~Показания счётчиков передаются автоматически, а не вводятся вручную.|Қашықтан деректер~Есептегіш көрсеткіштері қолмен енгізілмей, автоматты түрде жіберіледі.',
g5:'NB-IoT~A mobile network technology that can send small amounts of meter data using very little power.|NB-IoT~Технология мобильной сети, передающая небольшие объёмы данных счётчика с минимальным энергопотреблением.|NB-IoT~Есептегіш деректерінің шағын көлемін өте аз қуатпен жіберетін ұялы байланыс технологиясы.',
g6:'LoRaWAN~A long-range wireless technology designed for low-power devices.|LoRaWAN~Дальнобойная беспроводная технология для маломощных устройств.|LoRaWAN~Аз қуатты құрылғыларға арналған алыс қашықтықты сымсыз технология.',
gn:'Not every organization has these technologies installed yet.|Не у каждой организации они уже установлены.|Бұл технологиялар әр ұйымда әлі орнатылған емес.',
im:'Every drop counts.|Каждая капля важна.|Әр тамшы маңызды.',im1:'water saved this month|воды сэкономлено за месяц|айда үнемделген су',im2:'of monthly target|от месячной цели|айлық мақсаттан',
dc:'Demo calculation based on simulated monitoring data.|Демо-расчёт на основе имитации данных мониторинга.|Мониторингтің имитацияланған деректеріне негізделген демо-есеп.',
sch:'8,048 schools operate in Kazakhstan, a meaningful market for water monitoring. Public statistics on water loss specifically inside schools are limited. WaterGuard is designed to help organizations collect and analyze this data.|В Казахстане работает 8 048 школ — значимый рынок для мониторинга воды. Публичной статистики потерь воды именно внутри школ мало. WaterGuard помогает организациям собирать и анализировать такие данные.|Қазақстанда 8 048 мектеп жұмыс істейді — су мониторингі үшін маңызды нарық. Мектеп ішіндегі су шығыны туралы ашық статистика аз. WaterGuard ұйымдарға мұндай деректерді жинап, талдауға көмектеседі.',

mn:'6.8% (network losses, 2025) and ~20% (mentioned in a national-project publication) may refer to different segments and methodologies, so WaterGuard does not combine them.|6,8% (потери в сетях, 2025) и ~20% (из публикации о нацпроекте) могут относиться к разным сегментам и методикам, поэтому мы их не объединяем.|6,8% (желі шығыны, 2025) және ~20% (ұлттық жоба жарияламасында) әртүрлі сегменттер мен әдістемелерге қатысты болуы мүмкін, сондықтан біз оларды біріктірмейміз.',

x1:'In 2025, water losses in Kazakhstan’s water networks were 180.7 million m³ (6.8%), compared with 252.8 million m³ (9.6%) in 2024. Water supplied to the network in 2025 was about 2.66 billion m³.|В 2025 году потери воды в сетях Казахстана составили 180,7 млн м³ (6,8%) против 252,8 млн м³ (9,6%) в 2024 году. В сеть подано около 2,66 млрд м³.|2025 жылы Қазақстан су желілеріндегі шығын 180,7 млн м³ (6,8%) болды, 2024 жылы — 252,8 млн м³ (9,6%). 2025 жылы желіге шамамен 2,66 млрд м³ су берілді.',
x2:'In 2025 Kazakhstan had about 112.3 thousand km of water networks, of which about 22.9 thousand km are described as worn. No wear percentage is calculated because the methodology is not shown.|В 2025 году в Казахстане было около 112,3 тыс. км водных сетей, из них около 22,9 тыс. км описаны как изношенные. Процент износа не считаем: методика не приведена.|2025 жылы Қазақстанда шамамен 112,3 мың км су желісі болды, оның шамамен 22,9 мың км тозған деп сипатталған. Тозу пайызы есептелмейді: әдістеме көрсетілмеген.',
x3:'Irrigation systems, selected regions: losses reach 50% in some regions. Kazakhstan plans to modernize more than 14,000 km of irrigation networks and reduce losses to 25%. Not an urban-network figure.|Ирригационные системы, отдельные регионы: в некоторых регионах потери достигают 50%. Планируется модернизировать более 14 000 км оросительных сетей и снизить потери до 25%. Не показатель городских сетей.|Суару жүйелері, таңдалған өңірлер: кейбір өңірлерде шығын 50%-ға жетеді. 14 000 км-ден астам суару желісін жаңғыртып, шығынды 25%-ға дейін төмендету жоспарланған. Қалалық желі көрсеткіші емес.',
x4:'8,048 general education schools at the start of 2025–2026 (+1.6% vs 7,920 in 2024–2025); about 3.964 million students; more than 4.1 million expected in 2026–2027.|8 048 общеобразовательных школ в начале 2025–2026 учебного года (+1,6% к 7 920 в 2024–2025); около 3,964 млн учащихся; в 2026–2027 ожидается более 4,1 млн.|2025–2026 оқу жылының басында 8 048 жалпы білім беретін мектеп (2024–2025 жылы 7 920, +1,6%); шамамен 3,964 млн оқушы; 2026–2027 жылы 4,1 млн-нан астам күтіледі.',
x5:'Updated rules for operating water-metering devices: automation, remote collection and transmission of data.|Обновлённые правила эксплуатации приборов учёта воды: автоматизация, удалённый сбор и передача данных.|Су есептегіштерін пайдалану ережелері жаңартылды: автоматтандыру, деректерді қашықтан жинау және беру.',
x6:'New requirements for water-metering devices; the 2026 changes refer to NB-IoT and LoRaWAN for data transmission.|Новые требования к приборам учёта воды; в изменениях 2026 года упоминаются NB-IoT и LoRaWAN для передачи данных.|Су есептегіштеріне жаңа талаптар; 2026 жылғы өзгерістерде деректерді беру үшін NB-IoT және LoRaWAN аталады.',
x7:'International reference for household leaks. Used as an analogy only; no figure from it is shown.|Международный ориентир по бытовым утечкам. Только как аналогия, цифры не приводятся.|Тұрмыстық ағулар бойынша халықаралық бағдар. Тек ұқсастық ретінде, сандар көрсетілмейді.',
x8:'Existing water-monitoring solution used for market comparison. Details supplied by the research team.|Существующее решение для мониторинга воды, для сравнения с рынком. Детали предоставит исследовательская группа.|Нарықты салыстыруға арналған су мониторингі шешімі. Мәліметті зерттеу тобы береді.',
x9:'Schools may lose water through leaks that go unnoticed between monthly bills. This is our assumption and is not verified.|Школы могут терять воду из-за утечек, незаметных между ежемесячными счетами. Это наше предположение, оно не проверено.|Мектептер айлық шоттар арасында байқалмайтын ағулар арқылы су жоғалтуы мүмкін. Бұл біздің болжам, расталмаған.',
